name: "🐛 Bug ou atrito"
description: "Algo quebrou, confundiu ou não funcionou ao implantar/usar o Método Norte."
title: "[bug] "
labels: ["bug", "feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar! Cada travada sua vira melhoria do kit. Preencha o que souber — nenhum campo é obrigatório além do primeiro.
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: Descreva o problema. Onde travou (arquivo/passo)? O que você esperava vs. o que aconteceu?
      placeholder: "Ex.: no passo do validador, deu erro X que não entendi..."
    validations:
      required: true
  - type: input
    id: onde
    attributes:
      label: Onde? (arquivo ou passo)
      placeholder: "Ex.: INSTALACAO.md, prompt de setup / tools/validar-doc.js / módulo bancoDeDados"
  - type: dropdown
    id: ia
    attributes:
      label: Qual IA você estava usando?
      options:
        - Claude Code
        - Cursor
        - GitHub Copilot
        - Outra (diga na descrição)
        - Nenhuma / preenchi manual
  - type: input
    id: stack
    attributes:
      label: Sua stack
      placeholder: "Ex.: Node + PostgreSQL / Python + Django / .NET + SQL Server"
